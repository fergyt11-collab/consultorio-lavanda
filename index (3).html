<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultorio Lavanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eee4f6; --bg2:#dccbee; --ink:#2b1a3a; --ink2:#5e4a73; --line:#cfbbe3;
  --paper:#fbf6ee; --paper-ink:#2b1a3a; --paper-line:#eadfce;
  --plum:#4a2a63; --plum2:#6b3f8c; --violet:#8a5cb8; --lilac:#b89adb; --lav:#e6dbf3;
  --gold:#cfa25e; --rose:#d9799a; --mint:#4fa883; --tray:#3a2150; --tray2:#26143a;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1128;--bg2:#2c1b3e;--ink:#f1e8fa;--ink2:#c7b4da;--line:#4a3462;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1128;--bg2:#2c1b3e;--ink:#f1e8fa;--ink2:#c7b4da;--line:#4a3462;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(1100px 600px at 12% -10%,var(--bg2),transparent 60%),radial-gradient(900px 600px at 110% 110%,var(--bg2),transparent 60%),var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:'Fraunces',Georgia,'Times New Roman',serif;margin:0;line-height:1.1;font-weight:700}
#app{height:100%;display:flex;flex-direction:column}
#hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none}
@media (max-width:560px){.brand span{display:none}.chip{font-size:12.5px;padding:4px 9px}}
#hdr[hidden]{display:none}
.brand{display:flex;align-items:center;gap:8px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:18px}
.brand svg{width:28px;height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--paper);color:var(--paper-ink);font-weight:800;font-size:14px;border:1.5px solid var(--line);white-space:nowrap}
.chip svg{width:18px;height:18px}
.sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--plum);display:grid;place-items:center;padding:0}
.ibtn svg{width:20px;height:20px}
#root{flex:1;min-height:0;overflow:auto;position:relative}
.fade-in{animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scr{min-height:100%;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:20px;border:1px solid var(--paper-line);box-shadow:0 1px 0 #fff inset,0 14px 30px rgba(40,16,60,.22)}
.btn{font-weight:800;font-size:15px;padding:10px 18px;border-radius:999px;border:2px solid var(--plum);background:#fffaf2;color:var(--plum);box-shadow:0 3px 0 var(--plum);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--plum)}
.btn.primary{background:var(--plum2);color:#fff;border-color:#3a1f50;box-shadow:0 3px 0 #3a1f50}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ic{width:18px;height:18px;flex:none}
kbd{font:800 11px 'Nunito',sans-serif;padding:1px 6px;border-radius:6px;background:rgba(74,42,99,.12);color:inherit}

/* Title */
.title{flex-direction:row;gap:28px;flex-wrap:wrap}
.title-art svg{width:min(340px,70vw);height:auto;display:block}
.title-card{padding:26px 28px;max-width:400px;width:100%}
.title-card h1{font-size:44px;color:var(--plum)}
.title-card h1 span{display:block;font-size:20px;font-weight:500;color:var(--violet);margin-top:4px}
.title-card .sub{margin:10px 0 18px;color:#5e4a73;font-size:16px;line-height:1.45}
.field{display:block;font-weight:800;font-size:13px;color:#5e4a73;margin-bottom:12px}
.field input{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:12px;border:1.5px solid #d9c6e8;background:#fff;font:700 16px 'Nunito',sans-serif;color:var(--paper-ink)}
.fine{font-size:12.5px;color:#7a6690;margin:14px 0 0;line-height:1.4}

/* Agenda */
.ledger{max-width:620px;width:100%;padding:22px 24px;background:linear-gradient(transparent 31px,#efe3d2 32px) 0 70px/100% 32px,var(--paper)}
.ledger h2{font-size:28px;color:var(--plum)}
.ledger .when{color:#7a6690;font-weight:700;margin-top:2px}
.appts{list-style:none;padding:0;margin:18px 0}
.appts li{display:grid;grid-template-columns:54px 56px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1.5px dashed #e3d2bd}
.appts time{font-family:'Fraunces',serif;font-weight:700;color:var(--violet);padding-top:4px}
.appts b{font-size:16px}
.appts small{display:block;color:#7a6690;font-weight:700}
.appts p{margin:4px 0 0;line-height:1.4}
.pt{display:block;border-radius:50%;background:#e6dbf3}
.note{background:#f1e7fb;border-radius:12px;padding:10px 12px;margin:0 0 16px;line-height:1.4;font-size:14.5px}

/* Clinic */
.scr.clinic{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:12px;height:100%;align-items:stretch;justify-items:stretch}
.pcard{grid-column:1;grid-row:1/3;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.pcard>*{flex-shrink:0}
.pcard,.talkbox,.mcard,.appts,.up{overflow-wrap:anywhere}
.ptop{display:flex;gap:12px;align-items:center}
.ptop h3{font-size:20px}
.ptop small{color:#7a6690;font-weight:700;line-height:1.3;display:block}
.bubble{position:relative;background:#f3eafc;border-radius:14px;padding:10px 12px;font-family:'Fraunces',serif;font-style:italic;font-size:15px;line-height:1.35;min-height:44px}
.bubble:before{content:"";position:absolute;top:-8px;left:28px;border:8px solid transparent;border-top:0;border-bottom-color:#f3eafc}
.meter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-weight:800;font-size:13px}
.meter .ml{display:flex;align-items:center;gap:5px}
.bar{height:12px;border-radius:99px;background:#eadff4;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:#6fc6a2;transition:width .2s,background-color .3s}
.bar.mid i{background:#a98ad6}.bar.hot i{background:#dd7598}
.anxLbl{min-width:68px;text-align:right}
.motive b,.finds b{font-size:12.5px;color:#7a6690}
.motive p{margin:3px 0 0;line-height:1.4;font-size:14.5px}
.finds ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:5px}
.finds li{display:flex;gap:7px;align-items:flex-start;font-size:14px;line-height:1.3}
.finds li.muted{color:#8b7a9c;font-style:italic}
.finds li small{display:block;color:#8b7a9c}
.pact{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.bTalk{display:flex;align-items:center;justify-content:center;gap:8px}
.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;opacity:.6}
.pips i.on{background:currentColor;opacity:1}
.bFinish.ready{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 #3a1f50,0 0 0 6px rgba(207,162,94,.45)}}
.stage{grid-column:2;grid-row:1;position:relative;border-radius:24px;overflow:hidden;background:#24122f;box-shadow:inset 0 0 0 2px #4b2c63,0 14px 30px rgba(30,10,45,.35);min-height:260px}
#mouth{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:none;user-select:none;-webkit-user-select:none}
.stage.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-8px);background:rgba(36,18,47,.92);color:#f6eefc;font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;border:2px solid #6b4a86;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 24px);text-align:center;z-index:4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:#6fc6a2}.toast.warn{border-color:#e07ca0}
.hint{position:absolute;left:12px;bottom:12px;max-width:min(340px,calc(100% - 24px));background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:10px 34px 10px 12px;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:3;font-size:14px;line-height:1.4;border-left:5px solid var(--gold)}
.hint[hidden]{display:none}
.hint .hl{font-family:'Fraunces',serif;font-weight:700;color:var(--violet)}
.hint p{margin:2px 0 0}
.hint .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:20px;line-height:1;color:#7a6690;width:26px;height:26px}
.talkbox{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));padding:14px 16px;z-index:5}
.talkbox[hidden]{display:none}
.talkbox .who{margin:0;font-weight:800;color:var(--violet);font-size:13px}
.talkbox .say{font-family:'Fraunces',serif;font-style:italic;font-size:17px;margin:4px 0 8px;line-height:1.35}
.opt{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;margin-top:6px;padding:9px 12px;border-radius:12px;border:1.5px solid #d9c6e8;background:#fff;color:var(--paper-ink);font-weight:700;font-size:14.5px;line-height:1.35}
.opt:hover{border-color:var(--violet);background:#f6effd}
.patno{position:absolute;top:12px;right:14px;color:#cdb8e3;font-weight:800;font-size:12.5px;z-index:2}
.mstat{display:none}
.tray{grid-column:2;grid-row:2;display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:10px 12px 12px;border-radius:20px;background:linear-gradient(180deg,var(--tray),var(--tray2));box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -6px 12px rgba(0,0,0,.25);overflow-x:auto}
.tool{position:relative;flex:none;width:88px;padding:6px 6px 8px;border-radius:16px;border:2px solid #5b3a78;background:linear-gradient(180deg,#4b2c66,#33204a);color:#efe4fb;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .15s,border-color .15s,box-shadow .15s}
.tool svg.ti{width:60px;height:60px}
.tool b{font-size:13.5px}
.tool small{font-size:11px;opacity:.75;white-space:nowrap}
.tool kbd{position:absolute;top:5px;left:6px;background:rgba(255,255,255,.14);z-index:1}
.tool.sel{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 0 0 3px rgba(207,162,94,.28),0 8px 16px rgba(0,0,0,.35)}
.tool.locked{opacity:.5}
.tool .lock{position:absolute;top:5px;right:6px;width:15px;height:15px;display:none}
.tool.locked .lock{display:block}
@media (max-width:780px){
  .scr.clinic{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;height:auto;padding:8px;gap:8px}
  .mstat{display:flex;grid-column:1;grid-row:1;gap:8px;align-items:center;border-radius:14px;padding:6px 8px}
  .stage{grid-column:1;grid-row:2;aspect-ratio:600/400;min-height:0}
  .tray{grid-column:1;grid-row:3;justify-content:flex-start;padding:8px}
  .pcard{grid-column:1;grid-row:4}
  .pcard .ptop,.pcard .meter,.pcard .bTalk{display:none}
  .pcard .bubble:before{display:none}
  .mstat .meter{flex:1;grid-template-columns:1fr auto}
  .mstat .ml{display:none}
  .mstat .bTalk{padding:7px 10px;font-size:13px}
  .hint{top:8px;bottom:auto;left:8px;font-size:13px;padding:8px 30px 8px 10px}
  .toast{top:auto;bottom:10px;font-size:13px}
  .talkbox{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:none;width:auto;padding:10px 12px;z-index:30;box-shadow:0 -6px 30px rgba(30,10,45,.4)}
  .talkbox .say{font-size:15px}
  .opt{font-size:13.5px;padding:7px 10px}
  .patno{display:none}
  .tray{gap:6px}
  .tool{width:62px}
  .tool svg.ti{width:46px;height:46px}
  .tool small{display:none}
}

/* Overlays */
.ovl{position:fixed;inset:0;background:rgba(30,15,45,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ovl[hidden]{display:none}
.mcard{max-width:460px;width:100%;padding:22px;max-height:100%;overflow:auto}
.mcard h2{font-size:24px;color:var(--plum)}
.res-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.res-say{font-family:'Fraunces',serif;font-style:italic;line-height:1.35;margin:4px 0 0}
.res-list{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.res-list li{display:flex;gap:8px;align-items:center}
.ledgerline{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;padding:3px 0;border-bottom:1px dashed #e3d2bd}
.ledgerline.total{font-weight:800;font-size:16px;border:0;padding-top:8px}
.pause h2{text-align:center;margin-bottom:14px}
.pause .row{flex-direction:column;align-items:stretch}

/* Day end */
.dayend-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,520px);gap:16px;width:100%;max-width:860px}
.receipt{padding:20px}
.receipt .azul{display:flex;justify-content:center;margin-bottom:8px}
.receipt h2{text-align:center;font-size:24px;color:var(--plum);margin-bottom:12px}
.receipt .say{text-align:center;font-family:'Fraunces',serif;font-style:italic;margin:0 0 12px;color:#5e4a73}
.shop{padding:20px}
.shop h2{font-size:22px;color:var(--plum)}
.shop .lead{margin:4px 0 12px;color:#5e4a73}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{text-align:left;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;padding:10px;border-radius:14px;border:1.5px solid #e2d3c1;background:#fff;color:var(--paper-ink)}
.up>svg{width:44px;height:44px;grid-row:1/4}
.up b{font-size:14.5px}
.up small{font-size:12.5px;color:#6d5a80;line-height:1.3}
.up .cost{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--plum)}
.up.owned{background:#f1eafb;border-color:#c9b3ea}
.up.owned .cost{color:var(--mint)}
.up.poor .cost{color:#a0899e}
@media (max-width:780px){.dayend-grid{grid-template-columns:1fr}.ups{grid-template-columns:1fr}}

/* Home */
.home-wrap{width:100%;max-width:900px;display:flex;flex-direction:column;gap:12px;align-items:center}
.home-svg{width:100%;height:auto;border-radius:24px;box-shadow:0 18px 40px rgba(20,8,30,.4);display:block}
.home-cap{margin:0;font-family:'Fraunces',serif;font-size:18px;text-align:center}
.env{cursor:pointer}
.env:hover .envbody,.env:focus-visible .envbody{filter:drop-shadow(0 0 8px #f3d79c)}
.env.unread .glowring{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.15}}
.letter{position:relative;max-width:580px;width:100%;max-height:100%;overflow:auto;background:repeating-linear-gradient(#fbf5ea 0 33px,#e8dccb 33px 34px);color:#3b2252;padding:34px 32px 26px;border-radius:6px;box-shadow:0 20px 40px rgba(0,0,0,.4);transform:rotate(-.5deg)}
.letter.hand{font-family:'Caveat','Segoe Print','Bradley Hand',cursive;font-size:25px;line-height:34px}
.letter.hand p{margin:0 0 34px}
.letter.print{font-family:'Nunito',sans-serif;font-size:16px;line-height:1.55;background:#fbf7ef;transform:rotate(.4deg)}
.letter.print p{margin:0 0 12px}
.letter .from{font-family:'Fraunces',serif;font-weight:700;color:var(--violet);font-size:15px;margin-bottom:10px}
.letter .close{display:flex;justify-content:flex-end;margin-top:8px;font-family:'Nunito',sans-serif}
.letter .peony-top{display:flex;justify-content:center;margin:-10px 0 4px}

/* Final */
.final{position:relative;overflow:hidden}
.final-card{position:relative;z-index:1;max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.final-art{position:relative;width:260px;height:300px}
.final-art .pt{position:absolute;left:30px;top:0}
.final-art .bq{position:absolute;left:0;bottom:-8px;width:260px}
.final h1{font-size:clamp(34px,7vw,52px);color:var(--ink)}
.final h1 span{display:block;color:var(--violet)}
.final p{margin:0;font-size:17px;line-height:1.5;color:var(--ink2);max-width:46ch}
.final .sig{font-family:'Caveat',cursive;font-size:26px;color:var(--ink)}
.petals i{position:absolute;top:-20px;width:14px;height:10px;border-radius:60% 40% 60% 40%;background:#b98ce0;opacity:.7;animation:fall linear infinite}
.petals i:nth-child(3n){background:#9b6cc9}.petals i:nth-child(4n){background:#d9b8f2}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
.lettlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <linearGradient id="gSteelT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f4fa"/><stop offset=".55" stop-color="#a9a1b8"/><stop offset="1" stop-color="#e2dde9"/></linearGradient>
    <linearGradient id="gPurpleT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a77ad3"/><stop offset=".5" stop-color="#6b3f8c"/><stop offset="1" stop-color="#4a2a63"/></linearGradient>
    <radialGradient id="gGlassT" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cdbdf0"/><stop offset="1" stop-color="#7d68b0"/></radialGradient>

function tone(f,dur,type='sine',vol=.12,when=0,slide=null){
  if(S.muted) return; const c=ac(); if(!c) return; const t=c.currentTime+when;
  const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);

  o.connect(g); g.connect(AC.master); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,vol,freq,type='bandpass',q=1,when=0){

const LAYOUT=(()=>{const T=[];[true,false].forEach(upper=>{const s=[];for(let k=0;k<8;k++){const a=Math.abs((k-3.5)/3.5);s.push(1-.42*Math.pow(a,1.2));}
  const ws=s.map(v=>v*64),W=ws.reduce((a,b)=>a+b,0)+7*4;let x=300-W/2;
  for(let k=0;k<8;k++){const a=Math.abs((k-3.5)/3.5),w=ws[k],h=(upper?80:68)*s[k];const y=upper?92+a*a*42:296-a*a*42-h;T.push({i:upper?k:8+k,upper,x,y,w,h,s:s[k]});x+=w+4;}});return T;})();
function toothName(i){const up=i<8,k=up?i:i-8;const d=k<4?3-k:k-4;return `${['incisivo central','incisivo lateral','canino','premolar'][d]} ${up?'superior':'inferior'} ${k<4?'derecho':'izquierdo'}`;}
function toothAt(x,y){for(const L of LAYOUT){if(x>=L.x-2&&x<=L.x+L.w+2&&y>=L.y-4&&y<=L.y+L.h+5) return L.i;}return -1;}
function toothPath(L){const{x,y,w,h,upper}=L;const r=Math.min(w*.42,h*.42);
  return upper?`M${x},${y} H${x+w} V${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} H${x+r} Q${x},${y+h} ${x},${y+h-r} Z`
              :`M${x},${y+h} H${x+w} V${y+r} Q${x+w},${y} ${x+w-r},${y} H${x+r} Q${x},${y} ${x},${y+r} Z`;}
function gumPaths(){const up=LAYOUT.slice(0,8),lo=LAYOUT.slice(8);
  let d=`M10,10 L10,200 Q${up[0].x-26},${up[0].y+24} ${up[0].x},${up[0].y+14}`;up.forEach(L=>{d+=` L${L.x},${L.y+14} Q${L.x+L.w/2},${L.y-10} ${L.x+L.w},${L.y+14}`;});d+=` Q${up[7].x+up[7].w+26},${up[7].y+24} 590,200 L590,10 Z`;
  let e=`M10,390 L10,200 Q${lo[0].x-26},${lo[0].y+lo[0].h-24} ${lo[0].x},${lo[0].y+lo[0].h-14}`;lo.forEach(L=>{const b=L.y+L.h;e+=` L${L.x},${b-14} Q${L.x+L.w/2},${b+10} ${L.x+L.w},${b-14}`;});e+=` Q${lo[7].x+lo[7].w+26},${lo[7].y+lo[7].h-24} 590,200 L590,390 Z`;
  return [d,e];}

/* ---------------- Consulta ---------------- */
const TOOLS=[{id:'mirror',name:'Espejo',key:'1',verb:'Examinar'},{id:'scaler',name:'Raspador',key:'2',verb:'Quitar sarro'},{id:'drill',name:'Fresa',key:'3',verb:'Retirar caries'},{id:'resin',name:'Resina',key:'4',verb:'Sellar'},{id:'crown',name:'Corona',key:'5',verb:'Colocar'}];
function makePatient(def){
 const teeth=Array.from({length:16},(_,i)=>({tartar:(def.tartar&&def.tartar[i])||0,cavity:def.cavities.includes(i),broken:def.broken.includes(i),examined:false,drill:0,prepared:false,filled:false,crowned:false,damaged:false}));
 const anx=Math.max(0,def.anxiety-(S.up.sillon?15:0));const talks=3+(S.up.tetera?1:0);
 return {def,teeth,anx,peak:anx,talks,maxTalks:talks,talkCount:0,damage:0,perfects:0,introDone:false,tense:false,drilling:null,crowning:null,line:def.intro,mood:'',allDone:false};
}
function startPatient(){S.P=makePatient(dayPatients()[S.pi]);S.tool='mirror';S.hover=-1;S.rings=[];S.parts=[];S.talkOpen=null;go(renderClinic);}
function problems(P){const out=[];P.teeth.forEach((t,i)=>{
  if(P.def.tartar&&P.def.tartar[i]) out.push({kind:'sarro',i,w:1,done:t.tartar<=0,known:true});
  if(P.def.cavities.includes(i)) out.push({kind:'caries',i,w:3,done:t.filled,known:t.examined,t});
  if(P.def.broken.includes(i)) out.push({kind:'corona',i,w:4,done:t.crowned,known:true});});return out;}
function validTarget(tool,i){const t=S.P.teeth[i];if(!t) return false;
 if(tool==='mirror') return !t.examined; if(tool==='scaler') return t.tartar>0;
 if(tool==='drill') return t.cavity&&t.examined&&!t.prepared&&!t.filled; if(tool==='resin') return t.prepared&&!t.filled;
 if(tool==='crown') return t.broken&&!t.crowned; return false;}

 const talkBtn=`<button class="btn bTalk"><span style="color:var(--violet);display:flex">${ICON.talk}</span><span>Conversar</span><kbd>T</kbd><span class="pips"></span></button>`;

   </g>

   <path d="M120 44q180 -30 360 0" stroke="#fff" stroke-opacity=".25" stroke-width="5" fill="none" stroke-linecap="round"/>
   <g id="mDrill"></g><g id="mCrown"></g><g id="mFx"></g><g id="mTool" style="pointer-events:none"></g>
  </svg>

 <nav class="tray" aria-label="Instrumentos">${TOOLS.map(t=>`<button class="tool" data-tool="${t.id}" aria-label="${t.name}: ${t.verb}"><kbd>${t.key}</kbd>${ICON.lock}<svg class="ti" viewBox="-14 -14 112 112" aria-hidden="true"><g transform="rotate(45)">${toolArt(t.id,false)}</g></svg><b>${t.name}</b><small>${t.verb}</small></button>`).join('')}</nav>
 </section>`;
 bindClinic();drawTeeth();setTool(S.tool,true);setLine(d.intro);updatePanel();showIntro();
}
function bindClinic(){
 const svg=$('#mouth');
 svg.addEventListener('pointermove',onMove);
 svg.addEventListener('pointerdown',onDown);
 svg.addEventListener('pointerup',onUp);
 svg.addEventListener('pointercancel',onUp);
 svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){S.cur=null;moveTool();}if(S.P.drilling)releaseDrill();if(S.hover!==-1){S.hover=-1;dirty=true;}});
 $$('.tool').forEach(b=>b.onclick=()=>{setTool(b.dataset.tool);SFX.click();});
 $$('.bTalk').forEach(b=>b.onclick=openTalk);
 $('#bFinish').onclick=finishPatient;
}
function svgPt(e){const svg=$('#mouth');const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function canAct(){const P=S.P;return P&&P.introDone&&!S.talkOpen&&!S.paused&&$('#modal').hidden;}
function onMove(e){const p=svgPt(e);S.cur={x:p.x,y:p.y};moveTool();const i=toothAt(p.x,p.y);if(i!==S.hover){S.hover=i;dirty=true;}
 if(!canAct()) return; if(S.down&&S.tool==='scaler') scrape(p); if(S.P.drilling&&i!==S.P.drilling.i) releaseDrill();}
function onDown(e){e.preventDefault();ac();if(!canAct()) return;const svg=$('#mouth');try{svg.setPointerCapture(e.pointerId);}catch(_){}
 S.down=true;const p=svgPt(e);S.cur={x:p.x,y:p.y};S.lastP=p;moveTool();
 if(S.P.crowning){commitCrown();return;}
 const i=toothAt(p.x,p.y);S.hover=i;act(i,p);}
function onUp(){S.down=false;if(S.P&&S.P.drilling) releaseDrill();}
function setTool(id,silent){if(S.P&&S.P.crowning&&id!=='crown'){S.P.crowning=null;$('#mCrown').innerHTML='';}S.tool=id;$$('.tool').forEach(b=>b.classList.toggle('sel',b.dataset.tool===id));
 $('#mTool').innerHTML=`<g id="toolG"><g transform="scale(.72)">${toolArt(id,true)}</g></g>`;moveTool();dirty=true;}
function moveTool(){const g=$('#toolG');if(!g) return;const P=S.P;
 if(!S.cur||!P||P.crowning||S.talkOpen||!P.introDone){g.style.display='none';return;}g.style.display='';
 let{x,y}=S.cur;if(P.drilling&&!RM){x+=(Math.random()-.5)*1.6;y+=(Math.random()-.5)*1.6;}
 const ang=30+(x/600)*18;g.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${ang.toFixed(1)})`);}
function toast(msg,kind='soft'){const t=$('#toast');if(!t) return;t.textContent=msg;t.className='toast show '+kind;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className='toast '+kind;},2600);}
function showHint(html){const h=$('#hint');if(!h) return;h.innerHTML=`<span class="hl">Nota</span><p>${html}</p><button class="x" aria-label="Cerrar nota">×</button>`;h.hidden=false;h.querySelector('.x').onclick=()=>{h.hidden=true;};clearTimeout(showHint.t);showHint.t=setTimeout(()=>{h.hidden=true;},11000);}
function hintOnce(k){if(S.hints[k]) return;S.hints[k]=true;showHint(HINTS[k]);}
function setLine(s){S.P.line=s;$$('.bubble').forEach(b=>b.textContent='“'+s+'”');}
function shake(){if(RM) return;const s=$('#stage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');}
function ring(i,col,w=3,r1){const L=LAYOUT[i];S.rings.push({x:L.x+L.w/2,y:L.y+L.h/2,r0:6,r1:r1||L.w*.9,t:0,dur:.55,col,w});}
function burst(i,col,n,kind){const L=LAYOUT[i];for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,sp=20+Math.random()*60;
 S.parts.push({x:L.x+L.w/2+(Math.random()-.5)*L.w*.6,y:L.y+L.h*(L.upper?.6:.4),vx:Math.cos(a)*sp,vy:kind==='mist'?-30-Math.random()*30:Math.sin(a)*sp,g:kind==='fleck'?260:kind==='mist'?-10:0,life:.6+Math.random()*.4,max:1,r:kind==='mist'?2+Math.random()*2.5:1.4+Math.random()*1.6,col});}}
function addAnx(v){const P=S.P;if(v>0) v*=MULT[P.def.type];P.anx=clamp(P.anx+v,0,100);P.peak=Math.max(P.peak,P.anx);panelDirty=true;
 if(P.anx>=60) hintOnce('talk');
 if(P.anx>=100&&!P.tense){P.tense=true;if(P.drilling){P.drilling=null;drillStop();$('#mDrill').innerHTML='';}SFX.tense();setLine('Espere, espere... necesito un momento.');
  toast(P.talks>0?'Está demasiado tenso: conversa antes de usar la fresa o la corona.':'Sin conversaciones: termina lo que puedas y cierra la consulta.','warn');}}
function showIntro(){const P=S.P,tb=$('#talkbox');tb.innerHTML=`<p class="who">${esc(P.def.name)} se sienta en el sillón</p><p class="say">“${P.def.intro}”</p><div class="row" style="justify-content:flex-end"><button class="btn primary" id="bBegin">Empezar la revisión</button></div>`;tb.hidden=false;S.talkOpen='intro';moveTool();
 $('#bBegin').onclick=begin;setTimeout(()=>{const b=$('#bBegin');if(b)b.focus();},50);}
function begin(){const P=S.P;P.introDone=true;$('#talkbox').hidden=true;S.talkOpen=null;SFX.click();
 if(S.day===1&&S.pi===0){setTool('scaler');hintOnce('scaler');}
 else if(P.def.broken.length&&!S.hints.crown) hintOnce('crown');
 else if(P.def.cavities.length&&!S.hints.mirror) hintOnce('mirror');
 moveTool();panelDirty=true;}

function act(i){const P=S.P,tool=S.tool;if(i<0) return;const t=P.teeth[i];
 if(tool==='mirror'){doMirror(i);return;}
 if(tool==='scaler'){if(t.tartar<=0) toast('Aquí no hay sarro.');return;}
 if(tool==='drill'){
  if(P.tense){blocked();return;}
  if(t.filled){toast('Este diente ya está sellado.');return;}
  if(t.prepared){toast('La caries ya está retirada: usa la Resina (4).');return;}
  if(!t.examined){fail('Examina primero ese diente con el Espejo (1).');return;}
  if(!t.cavity){fail('Ese diente está sano: no hay nada que retirar.');return;}
  P.drilling={i};drillStart();setLine(P.def.type==='nervioso'?'Mmmh... mmh...':'Mmh.');panelDirty=true;return;}
 if(tool==='resin'){
  if(t.prepared&&!t.filled){t.filled=true;SFX.fill();ring(i,'#d9c4f6',4);burst(i,'#e6d4ff',10,'spark');toast('Resina colocada: diente sellado.','good');after();}
  else if(t.filled) toast('Ya está sellado.');
  else if(t.cavity&&t.examined) fail('Primero retira la caries con la Fresa (3).');
  else fail('Este diente no necesita resina.');return;}
 if(tool==='crown'){
  if(!t.broken||t.crowned){fail(t.crowned?'Ese diente ya tiene corona.':'Ese diente no está roto.');return;}
  if(P.tense){blocked();return;}
  P.crowning={i,ph:Math.random()*6};SFX.crownTick();moveTool();toast('Pulsa de nuevo cuando la corona pase por el centro.');return;}
}
function blocked(){SFX.bonk();toast(S.P.talks>0?'Está demasiado tenso. Conversa (T) para continuar.':'Está demasiado tenso y ya no quedan conversaciones.','warn');}
function fail(msg){SFX.bonk();toast(msg,'warn');addAnx(3);}
function after(){dirty=true;panelDirty=true;const P=S.P;if(!P.allDone&&problems(P).every(p=>p.done)){P.allDone=true;setLine('¿Ya terminamos? Se siente mucho mejor.');if(S.day===1&&S.pi===0) hintOnce('finish');}}
function doMirror(i){const P=S.P;const list=[i];if(S.up.lupa){const a=i<8?0:8;[i-1,i+1].forEach(j=>{if(j>=a&&j<a+8) list.push(j);});}
 let newly=0;const found=[];list.forEach(j=>{const t=P.teeth[j];if(!t.examined){t.examined=true;newly++;if(t.cavity&&!t.filled) found.push(j);}});
 ring(i,'#efe8ff',3);SFX.mirror();
 if(!newly){toast(list.length>1?'Ya revisaste esta zona.':'Ya revisaste este diente.');return;}
 addAnx(1);
 if(found.length){SFX.found();found.forEach(j=>ring(j,'#f0a8c0',3,LAYOUT[j].w*.8));toast(found.length>1?`${found.length} caries encontradas en esta zona.`:`Caries en el ${toothName(found[0])}.`,'good');hintOnce('drill');}
 else{SFX.healthy();toast(list.length>1?'Zona sana.':`${cap(toothName(i))}: sano.`);}
 after();}
let scrapeSndT=0;
function scrape(p){const P=S.P;const d=Math.hypot(p.x-S.lastP.x,p.y-S.lastP.y);S.lastP=p;if(d<.5) return;const i=toothAt(p.x,p.y);if(i<0) return;const t=P.teeth[i];if(t.tartar<=0) return;
 const amt=Math.min(t.tartar,d*.0042*(S.up.ultra?2:1));t.tartar-=amt;addAnx(amt*10);
 const now=performance.now();if(now-scrapeSndT>70){SFX.scrape();scrapeSndT=now;}
 if(Math.random()<.5) burst(i,'#d8c46e',1,'fleck');
 if(t.tartar<.03){t.tartar=0;SFX.clean();ring(i,'#bff0da',3);toast(`Sin sarro: ${toothName(i)}.`,'good');}
 after();}
function releaseDrill(){const P=S.P,d=P.drilling;if(!d) return;const t=P.teeth[d.i];P.drilling=null;drillStop();$('#mDrill').innerHTML='';
 if(t.drill>=.82){t.prepared=true;if(t.drill>1.05){t.damaged=true;P.damage++;SFX.bonk();toast('Te pasaste un poco: el diente quedó sensible. Aun así, séllalo.','warn');setLine('¡Ay! Eso sí lo sentí.');}
  else{SFX.prepared();ring(d.i,'#bff0da',4);toast('Caries retirada. Ahora sella con la Resina (4).','good');hintOnce('resin');setLine('¿Ya pasó lo del ruido?');}}
 else toast('Aún queda caries: mantén presionado hasta la zona verde.');
 dirty=true;panelDirty=true;}
function overdrill(){const P=S.P,i=P.drilling.i,t=P.teeth[i];t.damaged=true;t.prepared=true;P.damage++;P.drilling=null;drillStop();$('#mDrill').innerHTML='';
 SFX.bonk();shake();toast('Demasiado profundo: el diente quedó sensible. Aun así, séllalo con resina.','warn');setLine('¡Ay! Eso sí lo sentí.');addAnx(10);dirty=true;panelDirty=true;}
function commitCrown(){const P=S.P,c=P.crowning;if(!c) return;const L=LAYOUT[c.i];const off=Math.sin(c.ph)*(L.w*.9+10);const err=Math.abs(off);
 if(err<L.w*.3){P.teeth[c.i].crowned=true;P.crowning=null;$('#mCrown').innerHTML='';SFX.crownOk();ring(c.i,'#e9c98a',4,L.w*1.1);burst(c.i,'#f3dfb0',10,'spark');
  const perfect=err<L.w*.12;if(perfect) P.perfects++;toast(perfect?'Corona perfecta: ajuste exacto (+1 ficha).':'Corona colocada.','good');addAnx(3);moveTool();after();}
 else{SFX.bonk();addAnx(7);toast('Se desalineó. Espera a que pase por el centro y vuelve a pulsar.','warn');c.ph+=Math.PI*.5;}}
function openTalk(){const P=S.P;if(!P||!P.introDone||S.talkOpen||P.drilling||P.crowning||S.paused) return;
 if(P.talks<=0){toast('Ya no quedan conversaciones con este paciente.');return;}
 const sets=TALK[P.def.type],set=sets[P.talkCount%sets.length];const opts=[...set.opts].sort(()=>Math.random()-.5);
 const tb=$('#talkbox');tb.innerHTML=`<p class="who">${esc(P.def.name)}</p><p class="say">“${set.line}”</p>${opts.map((o,k)=>`<button class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${o.t}</span></button>`).join('')}`;
 tb.hidden=false;S.talkOpen=opts;$('#hint').hidden=true;moveTool();SFX.click();tb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>chooseTalk(opts[+b.dataset.k]));setTimeout(()=>{const b=tb.querySelector('.opt');if(b)b.focus();},40);}
function chooseTalk(o){const P=S.P;$('#talkbox').hidden=true;S.talkOpen=null;P.talks--;P.talkCount++;P.anx=clamp(P.anx+o.d,0,100);P.peak=Math.max(P.peak,P.anx);setLine(o.r);
 if(o.d<=-30){SFX.talkGood();toast('Lo tranquilizaste mucho.','good');}else if(o.d<0){SFX.talkOk();toast('Se relajó un poco.');}else{SFX.talkBad();toast('Eso no ayudó.','warn');}
 if(P.tense&&P.anx<80){P.tense=false;toast('Se relajó. Puedes continuar.','good');}
 moveTool();panelDirty=true;}

function updatePanel(){const P=S.P;if(!P||S.screen!=='clinic') return;
 const cls=P.anx>=70?'hot':P.anx>=35?'mid':'';
 $$('.bar').forEach(b=>{b.className='bar '+cls;b.firstElementChild.style.width=P.anx+'%';});
 const lbl=P.tense?'Tenso':P.anx<35?'Tranquilo':P.anx<70?'Inquieto':'Nervioso';$$('.anxLbl').forEach(e=>e.textContent=lbl);
 $$('.pips').forEach(e=>e.innerHTML=Array.from({length:P.maxTalks},(_,k)=>`<i class="${k<P.talks?'on':''}"></i>`).join(''));
 $$('.bTalk').forEach(b=>b.disabled=P.talks<=0||!P.introDone);
 const pr=problems(P);let li='';const tart=pr.filter(p=>p.kind==='sarro');

 let html;
 if(k==='b'){const L=LET_B[d];html=`<div class="letter print"><div class="from">${esc(L.from)}</div>${paras(L.body(H))}<div class="close"><button class="btn" id="bClose">Guardar la carta</button></div></div>`;}
 else{html=`<div class="letter hand">${d===4?`<div class="peony-top"><svg viewBox="0 0 120 60" width="120" aria-hidden="true">${peony(36,40,18,'#7d4fb0','#9b6cc9','#c9a3ec')}${peony(84,40,18,'#9b6cc9','#b98ce0','#dcc0f5')}${peony(60,30,22,'#8a5cb8','#ab7fd8','#d9b8f2')}</svg></div>`:''}${paras(LET_P[d](H,F))}<div class="close"><button class="btn" id="bClose">Guardar la carta</button></div></div>`;}
 modal(html);$('#bClose').focus();
 $('#bClose').onclick=()=>{closeModal();if(reread!==null){openRereadList();return;}S.read[k]=true;const svgWrap=$('.home-wrap svg');if(svgWrap) svgWrap.outerHTML=homeSVG();bindHome();};}

/* ---------------- Final ---------------- */
function renderFinal(){S.screen='final';store.set({hero:S.hero,from:S.from,muted:S.muted});
 root.innerHTML=`<section class="scr final"><div class="petals" aria-hidden="true">${RM?'':Array.from({length:16},(_,k)=>`<i style="left:${(k*6.7+2)%100}%;animation-delay:${(k*.8)%9}s;animation-duration:${9+k%6}s"></i>`).join('')}</div>
 <div class="final-card"><div class="final-art">${portrait(AZUL,'happy',200,false)}${bouquet()}</div>
 <h1>Feliz cumpleaños<span>${esc(S.hero)}</span></h1>
 <p>Esta semana cuidaste las sonrisas de ${PATIENTS.length} personas${S.smiles?`, y ${S.smiles} se ${S.smiles===1?'fue':'fueron'} a casa sin ninguna molestia`:''}. Hoy alguien quiso cuidar la tuya.</p>
 <p class="sig">Un pequeño juego hecho para ti, con cariño.<br>${esc(S.from)}</p>
 <div class="row"><button class="btn" id="bReread">Releer las cartas</button><button class="btn primary" id="bAgain">Volver al título</button></div></div></section>`;
 startMusic();$('#bReread').onclick=openRereadList;$('#bAgain').onclick=()=>go(renderTitle);}
function openRereadList(){modal(`<div class="paper mcard"><h2>Cartas de ${esc(S.from)}</h2><div class="lettlist">${DAYS.map((d,k)=>`<button class="btn" data-k="${k}">${d}</button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="bShut">Cerrar</button></div></div>`);
 $$('.lettlist .btn').forEach(b=>b.onclick=()=>openLetter('p',{reread:+b.dataset.k}));$('#bShut').onclick=closeModal;}

/* ---------------- Pausa y teclado ---------------- */
function setPause(on){if(['title','final'].includes(S.screen)) return;$('#pause').hidden=!on;S.paused=on;
 if(on){if(S.P&&S.P.drilling){S.P.drilling=null;$('#mDrill').innerHTML='';}drillStop();S.down=false;setTimeout(()=>$('#pResume').focus(),30);}}
$('#bPause').onclick=()=>setPause(true);
$('#pResume').onclick=()=>setPause(false);
$('#bMute').onclick=()=>{setMuted(!S.muted);};
$('#pMute').onclick=()=>{setMuted(!S.muted);};
$('#pRestart').onclick=()=>{setPause(false);closeModal();const d=S.dayStart;if(d){S.tokens=d.tokens;S.up={...d.up};S.smiles=d.smiles;S.hints={...d.hints};}startDay();};
$('#pMenu').onclick=()=>{setPause(false);closeModal();go(renderTitle);};
document.addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT') return;
 if(e.key==='Escape'){if(!$('#modal').hidden&&S.screen!=='clinic'){return;}setPause(!S.paused);return;}
 if(e.key==='m'||e.key==='M'){setMuted(!S.muted);return;}
 if(S.screen!=='clinic'||S.paused||!$('#modal').hidden) return;const P=S.P;
 if(S.talkOpen==='intro'){if(e.key==='Enter'){e.preventDefault();begin();}return;}
 if(Array.isArray(S.talkOpen)){const n=parseInt(e.key,10);if(n>=1&&n<=S.talkOpen.length){e.preventDefault();chooseTalk(S.talkOpen[n-1]);}return;}
 const n=parseInt(e.key,10);if(n>=1&&n<=5){setTool(TOOLS[n-1].id);SFX.click();return;}
 if(e.key==='t'||e.key==='T'){openTalk();return;}
 if(e.key===' '&&P&&P.crowning){e.preventDefault();commitCrown();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.screen==='clinic'&&!S.paused) setPause(true);});

const sv=store.get();if(sv) S.muted=!!sv.muted;
go(renderTitle);
})();
</script>
</body>
</html>
